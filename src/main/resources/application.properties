spring.application.name=api-shield

spring.datasource.url=jdbc:postgresql://localhost:5432/apishield
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
apishield.upstream.base-url=https://jsonplaceholder.typicode.com
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Gateway route configuration

apishield.routes.posts.path=/gateway/posts
apishield.routes.posts.upstream-path=/posts

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true